services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MODELS_DIR=/app/models
    volumes:
      - ./character_config.yaml:/app/character_config.yaml:ro
      - ./client/public/models:/app/models:ro

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY=http://backend:8000
    depends_on:
      - backend
